# Build the project website and publish it with GitHub Pages
# (repository settings: Pages → Source: GitHub Actions).
#
# Each part is built by its own job and cached on a hash of its inputs, so a
# merge that only touches the front page re-uses the docs, bundles and
# benchmark results. The site job then assembles everything and deploys it.
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write    # deploy to GitHub Pages
  id-token: write # verify the deployment's origin

# One deployment at a time; let a running deployment finish
concurrency:
  group: website
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.2

jobs:
  docs:
    name: API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache built docs
        id: cache
        uses: actions/cache@v4
        with:
          path: build/docs
          key: docs-${{ hashFiles('index.ts', 'src/**/*.ts', '!src/**/*.test.ts', 'typedoc.json', 'package.json', 'bun.lockb') }}
      - name: Cache dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lockb') }}
      - name: Build docs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          bun install --frozen-lockfile
          bun run docs:build
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: build/docs

  library:
    name: Library bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache built bundles
        id: cache
        uses: actions/cache@v4
        with:
          path: dist
          key: dist-${{ hashFiles('index.ts', 'src/**/*.ts', '!src/**/*.test.ts', 'package.json', 'bun.lockb') }}
      - name: Cache dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lockb') }}
      - name: Build bundles
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          bun install --frozen-lockfile
          bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lockb') }}
      - run: bun install --frozen-lockfile
      # Results are not committed: they are measured here and cached, and only
      # re-measured when the library or the benchmark suite changes.
      # (They depend on those, not on the report page.)
      - name: Cache benchmark results
        id: cache
        uses: actions/cache@v4
        with:
          path: benchmarks/results
          key: bench-results-${{ hashFiles('index.ts', 'src/**/*.ts', '!src/**/*.test.ts', 'benchmarks/*.ts', 'package.json', 'bun.lockb') }}
      - name: Run benchmarks (Bun)
        if: steps.cache.outputs.cache-hit != 'true'
        run: bun run bench:bun
      - name: Run benchmarks (Node)
        if: steps.cache.outputs.cache-hit != 'true'
        run: bun run bench:node
      - name: Build benchmark report
        run: bun run bench:web
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: benchmarks/web/dist

  site:
    name: Assemble and deploy
    needs: [docs, library, benchmarks]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: docs
          path: build/docs
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: benchmarks
          path: benchmarks/web/dist
      - name: Assemble site
        run: bun run site:build -- --assemble-only
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
